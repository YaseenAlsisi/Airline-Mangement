services:
  airline-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: airline-backend

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8081"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5432/airline_db"
      SPRING_DATASOURCE_USERNAME: "airline_user"
      SPRING_DATASOURCE_PASSWORD: "airsys8808"

      JWT_SECRET: "${JWT_SECRET}"

    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1200M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://airosys.duckdns.org/api/v1"

    volumes:
      - ./frontend/dist:/output
